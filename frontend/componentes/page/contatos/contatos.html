<section class="contatos-page">

    <div class="container">
      
      
      <h1 style="font-size: 36px;">Entre em Contato</h1> 
      
      <section class="contact-grid">

        <!-- Formulário de contato (1) -->
        <form class="contact-form" action="#" method="post" novalidate data-contato-form>
          <!-- label vinculado ao input pelo for/id; melhora acessibilidade -->
          <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required placeholder="Seu nome" style="color: #000;">

          
          <label for="assunto">Assunto</label>
          <input type="text" id="assunto" name="assunto" required placeholder="Assunto da mensagem">

          
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required placeholder="seu email">

          
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem..."></textarea>

          
          <button type="submit" class="btn">Enviar</button>
          <div class="form-feedback" aria-live="polite" style="margin-top:12px; font-size:14px;"></div>
        </form>

        <aside class="info-area">
          <!-- subtítulo -->
          <h2 class="subtitulo">Nosso Endereço</h2>
          <!-- endereço em parágrafo -->
          <p>Avenida dos Astronautas, 1758, Jardim da Granja, São José dos Campos - SP</p>

          <!-- Bloco responsivo para o mapa: "wrapper" para manter proporção -->
          <div class="map-wrapper" aria-hidden="false">
            <!-- iframe do Google Maps  -->
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3666.865130661748!2d-45.86057157468046!3d-23.211585229041773!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cc4b1ac5f67921%3A0x847d616d0a54349!2sAv.%20dos%20Astronautas%2C%201758%20-%20Jardim%20da%20Granja%2C%20S%C3%A3o%20Jos%C3%A9%20dos%20Campos%20-%20SP%2C%2012227-010!5e0!3m2!1spt-PT!2sbr!4v1759794340518!5m2!1spt-PT!2sbr" 
              title="Mapa - Avenida dos Astronautas, 1758"  
              loading="lazy"   
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen>
            </iframe>
          </div>
